<title>Guia do Desafio Fullstack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: estádio — barra lateral fixa com os 24 blocos (a "escalação"), área principal mostra um bloco por vez; placar no topo. */
:root {
  --paper: #F4F7F3;
  --card: #FFFFFF;
  --ink: #142019;
  --muted: #56685D;
  --line: #D6E0D8;
  --pitch: #1D6A3A;
  --pitch-soft: #E2EFE5;
  --chalk: #FFFFFF;
  --card-yellow: #F1C232;
  --yellow-soft: #FFF4D1;
  --yellow-ink: #6B5200;
  --card-red: #C2362C;
  --red-soft: #FBE5E2;
  --code-bg: #EEF3EF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E1611;
    --card: #152019;
    --ink: #E4ECE6;
    --muted: #93A79A;
    --line: #26372C;
    --pitch: #55C27D;
    --pitch-soft: #1B3324;
    --chalk: #0E1611;
    --card-yellow: #F2C53D;
    --yellow-soft: #33290C;
    --yellow-ink: #F6D77A;
    --card-red: #F06A5F;
    --red-soft: #3A1916;
    --code-bg: #0B120E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0E1611;
  --card: #152019;
  --ink: #E4ECE6;
  --muted: #93A79A;
  --line: #26372C;
  --pitch: #55C27D;
  --pitch-soft: #1B3324;
  --chalk: #0E1611;
  --card-yellow: #F2C53D;
  --yellow-soft: #33290C;
  --yellow-ink: #F6D77A;
  --card-red: #F06A5F;
  --red-soft: #3A1916;
  --code-bg: #0B120E;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; text-transform: uppercase; }
h2 { font-size: 2rem; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
p { margin: 0; }
code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--pitch); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--card-yellow); outline-offset: 2px; }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pitch); }
.muted { color: var(--muted); }

/* ---------- Topo / placar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--pitch);
  color: #fff;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.menu-btn { display: none; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 8px; padding: 6px 12px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.top-progress { flex: 1 1 200px; min-width: 160px; display: flex; flex-direction: column; gap: 4px; }
.top-progress small { font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; opacity: .9; }
.bar { height: 8px; background: rgba(255,255,255,.22); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: #F2C53D; border-radius: 99px; transition: width .4s ease; }
.scoreboard { display: flex; align-items: stretch; gap: 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scoreboard .cell { background: #0B1A10; color: #F2C53D; border-radius: 6px; padding: 2px 10px; text-align: center; min-width: 54px; }
.scoreboard .cell b { display: block; font-size: 1.35rem; line-height: 1.2; }
.scoreboard .cell span { display: block; font-family: var(--display); font-size: .68rem; letter-spacing: .12em; color: #CFE3D5; text-transform: uppercase; }
.scoreboard .label { font-family: var(--display); text-transform: uppercase; font-size: .75rem; letter-spacing: .1em; line-height: 1.15; align-self: center; max-width: 80px; }

/* ---------- Layout principal ---------- */
.shell {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px;
  max-width: 1400px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.side {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px);
  align-self: start; max-height: calc(100vh - 110px); overflow-y: auto;
  padding-right: 6px;
  display: flex; flex-direction: column; gap: 18px;
}
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group h4 { margin: 0 0 4px; font-family: var(--display); font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.nav-item {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px;
  text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 8px;
  font-size: .95rem; line-height: 1.25; color: var(--ink);
}
.nav-item:hover { background: var(--pitch-soft); }
.nav-item[aria-current="page"] { background: var(--pitch); color: #fff; }
.nav-item[aria-current="page"] .num { background: #fff; color: var(--pitch); border-color: #fff; }
.num {
  font-family: var(--display); font-weight: 800; font-size: 1rem; width: 30px; height: 30px;
  display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--pitch); color: var(--pitch);
  font-variant-numeric: tabular-nums;
}
.nav-item.done .num { background: var(--pitch); color: #fff; }
.nav-item .tick { font-size: .8rem; color: var(--pitch); font-weight: 700; }
.nav-item[aria-current="page"] .tick { color: #fff; }

main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.view { display: flex; flex-direction: column; gap: 28px; }

/* ---------- Componentes ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.prose { max-width: 70ch; }
.prose ul, .prose ol, ul.clean, ol.clean { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.hero p.lead { font-size: 1.15rem; max-width: 60ch; margin-top: 12px; }
.split { display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.split > div { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.split .you { background: var(--pitch-soft); }
.split .ai { background: var(--card); }
.split h3 { font-size: 1.1rem; }

.callout { border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; }
.callout::before { content: ""; width: 14px; height: 20px; border-radius: 2px; margin-top: 4px; }
.callout.warn { background: var(--yellow-soft); color: var(--ink); }
.callout.warn::before { background: var(--card-yellow); }
.callout.danger { background: var(--red-soft); }
.callout.danger::before { background: var(--card-red); }
.callout.tip { background: var(--pitch-soft); }
.callout.tip::before { background: var(--pitch); border-radius: 50%; width: 14px; height: 14px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; color: var(--muted); font-weight: 700; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td.n { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .88rem; white-space: nowrap; }
tr.today td { background: var(--yellow-soft); }
tr.today td:first-child { box-shadow: inset 4px 0 0 var(--card-yellow); }

/* Barras de pontuação */
.points { display: flex; flex-direction: column; gap: 8px; }
.pt-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; align-items: center; gap: 10px; font-size: .92rem; }
.pt-row b { font-family: var(--display); font-size: 1rem; letter-spacing: .04em; }
.pt-track { position: relative; height: 22px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.pt-track i { position: absolute; inset: 0 auto 0 0; background: var(--pitch); border-radius: 4px; }
.pt-track.front i { background: var(--card-yellow); }
.pt-track span { position: relative; z-index: 1; padding-left: 8px; font-size: .82rem; line-height: 22px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.pt-track i + span { color: #fff; }
.pt-track.front i + span { color: #2B2200; }
.pt-row .val { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend .b::before { background: var(--pitch); }
.legend .f::before { background: var(--card-yellow); }

/* Fluxo */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flow .chip { background: var(--pitch-soft); color: var(--ink); padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: .92rem; }
.flow .arrow { color: var(--muted); font-family: var(--mono); }

/* Método */
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.steps li { list-style: none; counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: .93rem; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 1.8rem; color: var(--pitch); line-height: 1; }
.steps li b { font-size: 1rem; }
.steps { padding: 0; margin: 0; }

/* Código */
.code { position: relative; }
.code pre {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; padding-top: 40px; overflow-x: auto; font-family: var(--mono); font-size: .84rem; line-height: 1.55; white-space: pre;
}
.code .copy {
  position: absolute; top: 8px; right: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; font-family: var(--display); font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: var(--pitch); font-weight: 700;
}
.code .lang { position: absolute; top: 10px; left: 14px; font-family: var(--display); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Bloco */
.block-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.jersey {
  width: 92px; height: 92px; border-radius: 18px; background: var(--pitch); color: #fff;
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1;
  font-variant-numeric: tabular-nums; position: relative;
}
.jersey small { position: absolute; top: 8px; font-size: .62rem; letter-spacing: .2em; font-weight: 700; opacity: .85; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tag { font-size: .85rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.tag strong { color: var(--ink); }
.goal { font-size: 1.15rem; border-left: 4px solid var(--card-yellow); padding: 4px 0 4px 16px; max-width: 72ch; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tab {
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
  padding: 8px 14px; font-family: var(--display); font-weight: 700; font-size: 1.02rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--pitch); border-bottom-color: var(--pitch); }
.tab .count { font-family: var(--mono); font-size: .75rem; margin-left: 4px; opacity: .8; }
.tabpanel { display: flex; flex-direction: column; gap: 16px; }

.concepts { display: flex; flex-direction: column; gap: 12px; }
.concept { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.concept:last-child { border-bottom: 0; padding-bottom: 0; }
.concept dt { font-weight: 700; }
.concept dd { margin: 0; }

ol.todo { margin: 0; padding: 0; list-style: none; counter-reset: t; display: flex; flex-direction: column; gap: 12px; }
ol.todo > li { counter-increment: t; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
ol.todo > li::before { content: counter(t); font-family: var(--display); font-weight: 800; color: #fff; background: var(--ink); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: .95rem; margin-top: 2px; }
ol.todo > li > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.checks label:hover { background: var(--pitch-soft); }
.checks input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--pitch); }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--pitch); }

.commit { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.commit code { background: none; padding: 0; font-size: .86rem; }
.mini-copy { flex: none; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: .78rem; color: var(--pitch); font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }

.qa { display: flex; flex-direction: column; gap: 10px; }
.qa details { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.qa summary { font-weight: 700; cursor: pointer; }
.qa details p { margin-top: 8px; color: var(--muted); }

.block-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 2px solid var(--line); padding-top: 18px; }
.btn { border: 2px solid var(--pitch); background: var(--card); color: var(--pitch); border-radius: 8px; padding: 8px 16px; font-family: var(--display); font-weight: 700; font-size: 1.02rem; letter-spacing: .08em; text-transform: uppercase; }
.btn.primary { background: var(--pitch); color: #fff; }
.btn.primary.is-done { background: var(--card); color: var(--pitch); }
.btn:disabled { opacity: .4; cursor: default; }

.phase-banner { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phase-banner .eyebrow { color: var(--muted); }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 8px 18px; border-radius: 99px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.checklist-group { display: flex; flex-direction: column; gap: 6px; }
.checklist-group h3 { font-size: 1.15rem; }

@media (max-width: 1100px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .menu-btn { display: inline-block; }
  nav.side { position: static; max-height: none; display: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  nav.side.open { display: flex; }
  .grid-2, .grid-3, .split { grid-template-columns: 1fr; }
  .concept { grid-template-columns: 1fr; gap: 4px; }
  .scoreboard .label { display: none; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .steps { grid-template-columns: 1fr; }
  .block-head { grid-template-columns: 1fr; }
  .jersey { width: 70px; height: 70px; font-size: 2.6rem; border-radius: 14px; }
  .panel { padding: 16px; }
  .scoreboard .cell { min-width: 44px; padding: 2px 6px; }
  .brand span.full { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="4.5" width="25" height="19" rx="2" fill="none" stroke="#fff" stroke-width="2"/><line x1="14" y1="4.5" x2="14" y2="23.5" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="3.6" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <span>Guia <span class="full">do Desafio</span></span>

</header>

/* =================== UTILITÁRIOS =================== */
function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
var toastTimer;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1600);
}
function copyText(text) {
  var done = function () { toast("Copiado"); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  } catch (e) { fallback(); }
  function fallback() {
    try {
      var ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); done();
    } catch (e2) { toast("Selecione o texto e copie com Ctrl+C"); }
  }
}
function codeBlock(text, lang, id) {
  var pre = el("pre", { tabindex: "0" }); pre.textContent = text;
  if (id) pre.id = id;
  return el("div", { class: "code" }, [
    lang ? el("span", { class: "lang", text: lang }) : null,
    el("button", { class: "copy", type: "button", onclick: function () { copyText(text); } }, ["Copiar"]),
    pre
  ]);
}
function callout(kind, html) { return el("div", { class: "callout " + kind }, [el("div", { html: html })]); }
function tableOf(t) {
  var thead = el("thead", null, [el("tr", null, t.head.map(function (h) { return el("th", { text: h }); }))]);

  return el("div", { class: "table-wrap" }, [el("table", null, [thead, tbody])]);
}

/* Calculadora de treino do valor de mercado (RN02–RN05) — só para estudo, em centavos inteiros */
function calculator() {
  var wrap = el("div", { class: "panel stack" });
  wrap.appendChild(el("h3", { text: "Treine: calculadora do valor de mercado" }));
  wrap.appendChild(el("p", { class: "muted prose", text: "Ferramenta de estudo para conferir suas contas à mão com a RN05. Escolha uma linha da tabela do enunciado e veja cada passo. Os números começam com o exemplo 9,50 · MAL_CONDICIONADO · agilidade 85 · 25 anos." }));
  var form = el("div", { class: "grid-3" });
  function field(id, label, input) { return el("label", { for: id, class: "stack", style: "gap:4px" }, [el("span", { class: "eyebrow", text: label }), input]); }
  var inBase = el("input", { id: "calc-base", type: "number", step: "0.01", min: "1", value: "9.50", style: "font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)" });
  var inCond = el("select", { id: "calc-cond", style: "font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)" }, ["APTO", "MAL_CONDICIONADO", "DOENTE"].map(function (o) { return el("option", { value: o, text: o }); }));
  inCond.value = "MAL_CONDICIONADO";
  var inAg = el("input", { id: "calc-ag", type: "number", min: "1", max: "100", value: "85", style: inBase.getAttribute("style") });
  var inAge = el("input", { id: "calc-age", type: "number", min: "16", max: "45", value: "25", style: inBase.getAttribute("style") });
  form.appendChild(field("calc-base", "Valor base", inBase));
  form.appendChild(field("calc-cond", "Condição", inCond));
  form.appendChild(field("calc-ag", "Agilidade", inAg));
  form.appendChild(field("calc-age", "Idade", inAge));
  wrap.appendChild(form);
  var out = el("div", { class: "table-wrap" });
  wrap.appendChild(out);
  function fmt(n) { return n.toFixed(2).replace(".", ","); }
  function pct(tenths) { var s = (tenths / 10).toString().replace(".", ","); return s + "%"; }
  function update() {
    var baseCents = Math.round(parseFloat(inBase.value || "0") * 100);
    var cond = inCond.value, ag = parseInt(inAg.value || "0", 10), age = parseInt(inAge.value || "0", 10);
    // tudo em décimos de ponto percentual, para evitar float
    var disc = cond === "APTO" ? 0 : cond === "MAL_CONDICIONADO" ? 150 : 300;
    var agNote = "sem efeito";
    if (cond !== "APTO") {
      if (ag >= 80) { disc = disc / 2; agNote = "80–100: desconto pela metade"; }
      else if (ag <= 30) { disc = disc + 100; agNote = "1–30: +10 pontos"; }
    } else agNote = "não age em APTO";
    var ageAdj = age <= 21 ? 100 : age >= 32 ? -100 : 0;
    var total = ageAdj - disc, capped = total < -400;
    if (capped) total = -400;
    // valor = base * (1000 + total) / 1000, em centavos, metade para longe do zero (valores positivos)
    var num = baseCents * (1000 + total);
    var cents = Math.floor((num + 500) / 1000);
    var floor = cents < 100;
    if (floor) cents = 100;
    var raw = (baseCents * (1000 + total) / 100000);
    var rows = [
      ["1. Desconto pela condição", pct(cond === "APTO" ? 0 : cond === "MAL_CONDICIONADO" ? 150 : 300)],
      ["2. Efeito da agilidade (" + agNote + ")", pct(disc)],
      ["3. Ajuste por idade", (ageAdj > 0 ? "+" : "") + pct(ageAdj)],
      ["4. Percentual total", (total > 0 ? "+" : "") + pct(total) + (capped ? " (limitado ao teto de −40%)" : "")],
      ["5. Base × (100 + total) ÷ 100", raw.toFixed(4).replace(".", ",")],
      ["Valor de mercado", "<b>" + fmt(cents / 100) + "</b>" + (floor ? " (subiu para o piso de 1,00)" : "")]
    ];
    out.innerHTML = "";
    out.appendChild(el("table", null, [el("tbody", null, rows.map(function (r) { return el("tr", null, [el("td", { text: r[0] }), el("td", { class: "n", html: r[1] })]); }))]));
  }
  [inBase, inCond, inAg, inAge].forEach(function (i) { i.addEventListener("input", update); i.addEventListener("change", update); });
  update();
  return wrap;
}

    grid.appendChild(el("div", { class: "panel checklist-group" }, [el("h3", { text: g[0] }), checklist("t" + gi, g[1], function () { renderTraps(clear(main)); })]));
  });
  v.appendChild(grid);
  main.appendChild(v);
}

/* =================== ROTEAMENTO =================== */
function render() {
  var route = (location.hash || "#inicio").slice(1);
  var main = clear(document.getElementById("main"));
  var m = /^bloco-(\d+)$/.exec(route);
  if (m && B[+m[1]]) { renderNav(route); renderBlock(main, +m[1]); }
  else if (route === "pegadinhas") { renderNav(route); renderTraps(main); }
  else if (route === "anexos") { renderNav(route); renderAnnex(main); }
  else { renderNav("inicio"); renderHome(main); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

document.getElementById("menu-btn").addEventListener("click", function () {
  var side = document.getElementById("side");
  var open = side.classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
});

/* =================== PLACAR =================== */
var DEADLINE = Date.parse("2026-10-23T20:00:00-03:00");
function tick() {
  var diff = Math.max(0, DEADLINE - Date.now());
  var d = Math.floor(diff / 86400000), h = Math.floor(diff % 86400000 / 3600000), mi = Math.floor(diff % 3600000 / 60000);
  document.getElementById("cd-d").textContent = String(d).padStart(2, "0");
  document.getElementById("cd-h").textContent = String(h).padStart(2, "0");
  document.getElementById("cd-m").textContent = String(mi).padStart(2, "0");
}
tick(); setInterval(tick, 30000);

render();
})();
</script>
